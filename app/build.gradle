apply plugin: 'com.android.application'

android {
    compileSdkVersion 35

    defaultConfig {
        applicationId "ca.datamagic.noaaweatherwidget"
        minSdkVersion 30
        targetSdkVersion 35
        versionCode 129
        versionName "2.29"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets { main { res.srcDirs = ['src/main/res', 'src/main/res/anim'] } }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
        jniLibs {
            // Forces native libraries to be stored uncompressed and page-aligned
            //useLegacyPackaging = false
        }
    }
    namespace 'ca.datamagic.noaa.widget'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-places:17.1.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'it.sephiroth.android.library.imagezoom:imagezoom:2.3.0'
    implementation 'com.univocity:univocity-parsers:2.9.1'
    implementation 'org.apmem.tools:layouts:1.10'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation(files("libs/Android-TiffBitmapFactory-master-release.aar"))
    //implementation "io.github.beyka:Android-TiffBitmapFactory:0.9.9.1"
    //implementation("io.github.beyka:Android-TiffBitmapFactory:0.9.9.1") {
    //    exclude module: 'libtifffactory'
    //    exclude module: 'libtiffsaver'
    //    exclude module: 'libtiffconverter'
    //    exclude module: 'libtiff'
    //}
    //implementation "com.github.T8RIN:TiffDecoder:1.0.5"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
}
